coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

flags:
  coordinator:
    paths:
      - custom_components/dlight/coordinator.py
  config_flow:
    paths:
      - custom_components/dlight/config_flow.py
  light:
    paths:
      - custom_components/dlight/light.py
  button:
    paths:
      - custom_components/dlight/button.py
  binary_sensor:
    paths:
      - custom_components/dlight/binary_sensor.py
  sensor:
    paths:
      - custom_components/dlight/sensor.py
  event:
    paths:
      - custom_components/dlight/event.py
  update:
    paths:
      - custom_components/dlight/update.py

component_management:
  default_rules:
    statuses:
      - type: component
        target: auto
        threshold: 5%
  individual_components:
    - component_id: coordinator
      name: Coordinator
      paths:
        - custom_components/dlight/coordinator.py
    - component_id: config_flow
      name: Config Flow
      paths:
        - custom_components/dlight/config_flow.py
    - component_id: light_entity
      name: Light Entity
      paths:
        - custom_components/dlight/light.py
    - component_id: diagnostics
      name: Diagnostics
      paths:
        - custom_components/dlight/binary_sensor.py
        - custom_components/dlight/button.py
        - custom_components/dlight/diagnostics.py
    - component_id: integration_init
      name: Integration Init
      paths:
        - custom_components/dlight/__init__.py
        - custom_components/dlight/const.py
    - component_id: sensor
      name: Sensor
      paths:
        - custom_components/dlight/sensor.py
    - component_id: event
      name: Event
      paths:
        - custom_components/dlight/event.py
    - component_id: update
      name: Update
      paths:
        - custom_components/dlight/update.py
