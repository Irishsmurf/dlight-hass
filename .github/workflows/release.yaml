name: Release

# Pushing a tag like v1.4.0 validates the tree and publishes the release.
# Tags with a suffix (v1.4.0-rc1) publish as prereleases.
on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          BASE="${GITHUB_REF_NAME#v}"   # v1.4.0-rc1 -> 1.4.0-rc1
          BASE="${BASE%%-*}"            # 1.4.0-rc1  -> 1.4.0
          MANIFEST="$(jq -r .version custom_components/dlight/manifest.json)"
          if [ "$BASE" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (base $BASE) does not match manifest version $MANIFEST"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches manifest version $MANIFEST"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component pytest-sugar

      - name: Run tests
        run: |
          pytest

  release:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dlight.zip
        # HACS zip_release convention: manifest.json at the zip root.
        # brand/ is only needed in the repo tree (HACS brands check);
        # users' installs don't need it.
        run: |
          cd custom_components/dlight
          zip -r "$GITHUB_WORKSPACE/dlight.zip" . -x "brand/*" -x "__pycache__/*"
          unzip -l "$GITHUB_WORKSPACE/dlight.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" dlight.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $PRERELEASE
