<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="A dLight device in Home Assistant with its light, identify button, and connectivity sensor entities">
  <defs>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB54D"/>
      <stop offset="0.5" stop-color="#FFF1DC"/>
      <stop offset="1" stop-color="#7CACF8"/>
    </linearGradient>
    <filter id="card" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#3C4043" flood-opacity="0.18"/>
    </filter>
  </defs>
  <style>
    .name { font: 700 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3C4043; }
    .sub  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5f6368; }
    .row  { font: 700 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3C4043; }
    .val  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #5f6368; }
    .tag  { font: 700 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  </style>

  <!-- card -->
  <rect x="20" y="20" width="520" height="360" rx="20" fill="#ffffff" stroke="#e8eaed" filter="url(#card)"/>

  <!-- header: lamp mark + device name -->
  <g transform="translate(44,44) scale(0.16)">
    <rect x="76" y="76" width="360" height="200" rx="100" fill="#4285F4"/>
    <rect x="104" y="104" width="304" height="144" rx="72" fill="url(#temp)"/>
    <rect x="242" y="268" width="28" height="146" fill="#4285F4"/>
    <rect x="156" y="402" width="200" height="32" rx="16" fill="#4285F4"/>
  </g>
  <text x="140" y="64" class="name">Desk Lamp</text>
  <text x="140" y="86" class="sub">dLight · local control</text>
  <line x1="44" y1="116" x2="516" y2="116" stroke="#eceff1" stroke-width="2"/>

  <!-- Row 1: Light (primary) -->
  <g transform="translate(0,150)">
    <rect x="44" y="-22" width="44" height="44" rx="12" fill="#e8f0fe"/>
    <circle cx="66" cy="0" r="9" fill="#4285F4"/>
    <g stroke="#4285F4" stroke-width="2.4" stroke-linecap="round">
      <line x1="66" y1="-17" x2="66" y2="-13"/><line x1="66" y1="13" x2="66" y2="17"/>
      <line x1="49" y1="0" x2="53" y2="0"/><line x1="79" y1="0" x2="83" y2="0"/>
    </g>
    <text x="104" y="-3" class="row">Light</text>
    <text x="104" y="16" class="val">On · 80% · 4000 K</text>
    <rect x="430" y="-13" width="86" height="26" rx="13" fill="#e8f0fe"/>
    <text x="473" y="4" class="tag" fill="#1a73e8" text-anchor="middle">light</text>
  </g>

  <!-- Row 2: Identify button (diagnostic) -->
  <g transform="translate(0,232)">
    <rect x="44" y="-22" width="44" height="44" rx="12" fill="#f1f3f4"/>
    <g stroke="#5f6368" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="66" cy="0" r="4" fill="#5f6368" stroke="none"/>
      <path d="M55 -11 A 16 16 0 0 1 77 -11"/>
      <path d="M50 -17 A 24 24 0 0 1 82 -17"/>
    </g>
    <text x="104" y="-3" class="row">Identify</text>
    <text x="104" y="16" class="val">Press to flash the lamp</text>
    <rect x="416" y="-13" width="100" height="26" rx="13" fill="#f1f3f4"/>
    <text x="466" y="4" class="tag" fill="#5f6368" text-anchor="middle">diagnostic</text>
  </g>

  <!-- Row 3: Connectivity sensor (diagnostic) -->
  <g transform="translate(0,314)">
    <rect x="44" y="-22" width="44" height="44" rx="12" fill="#e6f4ea"/>
    <g stroke="#1e8e3e" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="66" cy="6" r="3" fill="#1e8e3e" stroke="none"/>
      <path d="M58 -2 A 11 11 0 0 1 74 -2"/>
      <path d="M52 -8 A 20 20 0 0 1 80 -8"/>
    </g>
    <text x="104" y="-3" class="row">Connectivity</text>
    <text x="104" y="16" class="val">Connected</text>
    <rect x="416" y="-13" width="100" height="26" rx="13" fill="#f1f3f4"/>
    <text x="466" y="4" class="tag" fill="#5f6368" text-anchor="middle">diagnostic</text>
  </g>
</svg>
