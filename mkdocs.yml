site_name: dLight for Home Assistant
site_description: Local control for dLight smart lamps in Home Assistant — no cloud, low latency.
site_author: Irishsmurf
site_url: https://irishsmurf.github.io/dlight-hass/

repo_name: Irishsmurf/dlight-hass
repo_url: https://github.com/Irishsmurf/dlight-hass
edit_uri: edit/main/docs/

copyright: Built for Home Assistant. dLight is a trademark of its respective owner; this is an unofficial community integration.

theme:
  name: material
  language: en
  custom_dir: overrides
  logo: assets/dark_icon.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Light mode — brand blue (#4285F4) on a neutral canvas.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode — lightened brand blue (#8AB4F8) for contrast.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/brand.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Irishsmurf/dlight-hass
      name: dlight-hass on GitHub
    - icon: simple/homeassistantcommunitystore
      link: https://hacs.xyz/
      name: HACS

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Features: user-guide/features.md
      - Transitions: user-guide/transitions.md
      - Troubleshooting: user-guide/troubleshooting.md
      - Diagnostics & Bug Reports: user-guide/diagnostics.md
  - Architecture:
      - Overview: architecture/overview.md
      - Coordinator & Polling: architecture/coordinator.md
      - Light Entity & Optimistic State: architecture/light-entity.md
      - Config Flow & IP Self-Healing: architecture/config-flow.md
  - Contributing:
      - Development Setup: contributing/development.md
      - Testing: contributing/testing.md
      - Localization: contributing/localization.md
      - Releasing: contributing/releasing.md
  - Brand: brand.md
